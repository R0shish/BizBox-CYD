name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-check:
    name: host check (stubs + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile against stubs (core 2 + 3) and run unit tests
        run: tools/check.sh

  firmware:
    name: firmware (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2.0.17"
          - core: "3.x"
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core ${{ matrix.core }}
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          if [ "${{ matrix.core }}" = "3.x" ]; then
            arduino-cli core install esp32:esp32
          else
            arduino-cli core install esp32:esp32@${{ matrix.core }}
          fi
          arduino-cli core list

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "TFT_eSPI" "ArduinoJson@7.4.2" "ESP8266Audio" "QRCode"
          # ESP8266SAM isn't in the Library Manager index: install it from git
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/earlephilhower/ESP8266SAM.git
          arduino-cli lib list
          cp ci/User_Setup.h "$HOME/Arduino/libraries/TFT_eSPI/User_Setup.h"

      - name: Compile
        run: |
          # arduino-cli wants the folder named after the .ino
          SK="$RUNNER_TEMP/esp"
          mkdir -p "$SK"
          cp *.ino *.h "$SK/"
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default \
            --output-dir "$RUNNER_TEMP/out" "$SK" 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Size report
        if: always()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          FLASH=$(grep -Eo 'Sketch uses [0-9]+ bytes \([0-9]+%\) of program storage space. Maximum is [0-9]+ bytes' "$LOG" || true)
          RAM=$(grep -Eo 'Global variables use [0-9]+ bytes \([0-9]+%\) of dynamic memory[^.]*' "$LOG" || true)
          {
            echo "### ESP32 core ${{ matrix.core }}"
            echo ""
            echo "Board: ESP32 Dev Module, default partition scheme (1.25 MB app)."
            echo ""
            echo "- ${FLASH:-build failed, no size}"
            echo "- ${RAM:-}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$FLASH"; echo "$RAM"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bizbox-esp32-core-${{ matrix.core }}
          path: |
            ${{ runner.temp }}/out/*.bin
            ${{ runner.temp }}/out/*.elf
          if-no-files-found: error
